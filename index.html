body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--texto);font:400 17px/1.5 "Fira Sans","Source Sans 3","Segoe UI",Calibri,Arial,sans-serif;
  padding:clamp(28px,5vh,56px) clamp(16px,4vw,48px);gap:clamp(24px,4.5vh,48px)}
.logo{width:clamp(200px,24vw,320px);height:auto;display:block}
.foto{width:min(1000px,100%);height:auto;display:block}
ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:14px clamp(24px,4vw,56px)}
a{display:flex;align-items:center;gap:10px;color:var(--texto);text-decoration:none;font-size:1.05rem}
a svg{color:var(--teal)}
a:hover{color:var(--teal-escuro)}
a:focus-visible{outline:3px solid var(--teal);outline-offset:4px}
.end{margin:-8px 0 0;font-size:.88rem;color:var(--cinza-logo);text-align:center}
</style>
