<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cláudio Pupo Arquiteto — Portfólio</title>
<meta name="description" content="Cláudio Pupo Arquiteto — projetos de arquitetura e urbanismo em Viçosa-MG.">
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#4CBABF; --teal2:#54C0BD; --teal-logo:#57A695; --teal-dk:#125F5B; --teal-lt:#EAF6F6;
  --gray:#A6A6A6; --gray-dk:#6E7072; --text:#4D4D4F; --line:#DCE9E9; --w:1160px; --pw:1280px;
  --font:'Fira Sans','Source Sans 3','Segoe UI',Calibri,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);font-weight:400;color:var(--text);background:#e8eaeb;line-height:1.65;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
em{font-style:normal;color:var(--teal-dk);font-weight:500}
.wrap{max-width:var(--w);margin:0 auto;padding:0 40px}
section{padding:96px 0;scroll-margin-top:70px}

#page{max-width:var(--pw);margin:0 auto;background:#fff;position:relative;overflow-x:clip;min-height:100vh;box-shadow:0 0 0 1px #dcdfe0}
.bar-t,.bar-g{display:none}
.bar-t{top:0;height:27vh;background:var(--teal)}
.bar-g{top:27vh;bottom:0;background:var(--gray)}

nav{position:sticky;top:0;z-index:50;background:#fff;border-top:6px solid var(--teal2);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:68px}
.nav-in img{height:38px;width:auto}
.nav-links{display:flex;gap:34px;list-style:none;align-items:center}
.nav-links a{text-decoration:none;font-size:.92rem;color:var(--gray-dk);transition:color .2s}
.nav-links a:hover{color:var(--teal-dk)}
#editBtn{display:none}

.eyebrow{display:flex;align-items:center;gap:10px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-dk);font-weight:500;margin-bottom:18px}
.eyebrow::before{content:'';width:10px;height:10px;background:var(--teal2)}
h2{font-weight:400;font-size:clamp(1.8rem,3.2vw,2.5rem);line-height:1.2;color:var(--text);margin-bottom:20px}

.btn{display:inline-block;padding:13px 28px;border:1px solid var(--teal-dk);color:var(--teal-dk);background:#fff;font:500 .92rem var(--font);cursor:pointer;text-decoration:none;transition:all .2s}
.btn:hover{background:var(--teal-lt)}
.btn.fill{background:var(--teal-dk);color:#fff}
.btn.fill:hover{background:var(--teal-logo);border-color:var(--teal-logo)}
.btn.sm{padding:7px 14px;font-size:.8rem}
.btn.danger{border-color:#b3413f;color:#b3413f}

.prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--teal-dk);z-index:2}
.hero{position:relative;min-height:calc(100vh - 74px);display:flex;align-items:center;padding:110px 0 120px;overflow:hidden}
.hero>.wrap{position:relative;width:100%}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);will-change:transform}
.hero-ov{position:absolute;inset:0;background:rgba(12,38,37,.56)}
.hero .eyebrow,.hero h1,.hero p.lead,.hero .cta{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.hero h1{animation-delay:.12s}.hero p.lead{animation-delay:.26s}.hero .cta{animation-delay:.4s}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hero h1.hero-logo{margin-bottom:30px;line-height:0}
.hero h1.hero-logo{width:min(88%,500px)}
.hero-logo img{height:auto;display:block;margin:0 auto}
.hero-brand{width:clamp(150px,19vw,240px);height:auto;margin:0 auto 28px}
.hero-logo .sl1{width:58%;margin-bottom:2.2%}
.hero-logo .sl2{width:97%}
.hero.has-img .hero-logo img{background:#fff;padding:26px 34px}
.hero.has-img.light .hero-ov{background:rgba(255,255,255,.76)}
.hero.has-img.light .hero-logo img{background:transparent;padding:0}
.hero.has-img.light h1,.hero.has-img.light p.lead{color:var(--text)}
.hero.has-img.light p.lead{color:#3f4143;font-weight:400}
.hero.has-img.light .eyebrow{color:var(--teal-dk)}
.hero.has-img.light .btn:not(.fill){background:rgba(255,255,255,.85);color:var(--teal-dk);border-color:var(--teal-dk)}
.hero.has-img.light .btn:not(.fill):hover{background:#fff}
.hero.has-img h1,.hero.has-img p.lead{color:#fff}
.hero.has-img h1 em,.hero.has-img .eyebrow{color:#AEE3DE}
.hero.has-img .btn:not(.fill){background:transparent;color:#fff;border-color:#fff}
.hero.has-img .btn:not(.fill):hover{background:rgba(255,255,255,.14)}
.hero h1{font-weight:400;font-size:clamp(2.6rem,6.2vw,5.4rem);line-height:1.05;letter-spacing:-.01em;color:var(--text);max-width:900px;margin-bottom:28px}
.hero h1 em{font-weight:600}
.hero p.lead{font-size:1.12rem;max-width:560px;color:var(--gray-dk);margin-bottom:40px;font-weight:300}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap}

#sobre{background:#fff}
.about{display:grid;grid-template-columns:5fr 7fr;gap:88px;align-items:center}
.foto{position:relative;aspect-ratio:4/5;background:var(--teal-lt);overflow:hidden}
.foto img.ph{position:absolute;inset:0;margin:auto;width:42%;opacity:.7}
.foto img.real{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.foto-wrap{position:relative}
.foto-wrap::after{content:'';position:absolute;right:-14px;bottom:-14px;width:46%;height:46%;border-right:3px solid var(--teal2);border-bottom:3px solid var(--teal2);pointer-events:none}
.about p{color:var(--gray-dk);font-size:1.04rem;margin-bottom:18px;font-weight:300}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px;padding-top:30px;border-top:1px solid var(--line)}
.stat-v{font-size:1.9rem;font-weight:500;color:var(--teal-dk);line-height:1.1}
.stat-l{font-size:.82rem;color:var(--gray-dk);margin-top:6px}

#projetos{background:#2a2e30;color:#fff;overflow:hidden}
#projetos h2{color:#fff}
#projetos .eyebrow{color:#AEE3DE}
#projetos .btn.fill{background:var(--teal2);border-color:var(--teal2);color:#0f2f2e}
#projetos .chip{border-color:#6c7678;color:#d7e3e3}
#projetos .chip:hover{background:rgba(255,255,255,.08)}
#projetos .chip.on{background:var(--teal2);border-color:var(--teal2);color:#0f2f2e}
.slides{--sw:min(78vw,940px);--pad:calc((min(100vw,var(--pw)) - var(--sw))/2);display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--pad);scroll-padding-left:var(--pad);scrollbar-width:none;cursor:grab}
.slides::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.slide{flex:0 0 var(--sw);scroll-snap-align:start;position:relative}
.simg{aspect-ratio:3/2;background:#383d3f;overflow:hidden;position:relative}
.simg .bg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(22px) brightness(.5)}
.simg img.real{position:relative;width:100%;height:100%;object-fit:contain;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.simg img.ph{position:absolute;inset:0;margin:auto;width:16%;opacity:.35}
.slide:hover .simg img.real{transform:scale(1.04)}
.scap{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:16px}
.scap .cat{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:#AEE3DE;font-weight:500}
.scap .nome{font-size:1.6rem;font-weight:400;line-height:1.2;color:#fff}
.scap .ano{font-size:.9rem;color:#b9c2c3}
.slider-nav{display:flex;justify-content:space-between;align-items:center;margin-top:34px}
.cnt{font-size:1.05rem;letter-spacing:.16em;font-weight:500;color:#fff}
.arrows{display:flex;gap:10px}
.arrows button{width:46px;height:46px;background:transparent;border:1px solid #8a9496;color:#fff;font-size:1.2rem;cursor:pointer;transition:all .2s}
.arrows button:hover{background:var(--teal2);border-color:var(--teal2);color:#0f2f2e}
.slides.drag,.strip.drag{scroll-snap-type:none;cursor:grabbing}
.slides,.strip{user-select:none;-webkit-user-select:none}
img{-webkit-user-drag:none}
.empty{color:#b9c2c3;padding:30px 0}
.stripwrap{margin-top:8px}
.strip{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;cursor:grab;padding:0;margin:0 var(--pad,40px)}
.gi{flex:0 0 clamp(240px,26vw,340px);position:relative}
.gimg{aspect-ratio:4/5;background:var(--teal-lt);overflow:hidden;position:relative}
.gimg img.real{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.gimg img.ph{position:absolute;inset:0;margin:auto;width:34%;opacity:.55}
.gi:hover .gimg img.real{transform:scale(1.05)}
.gcap{font-size:.84rem;color:var(--gray-dk);margin-top:8px;min-height:1.3em}
.hintdrag{display:flex;align-items:center;gap:14px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-dk)}
#processo{background:var(--teal-lt)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:40px;margin-top:40px}
.step{position:relative;padding-top:28px}
.step::before{content:'';position:absolute;top:0;left:0;height:2px;width:0;background:var(--teal2);transition:width .9s ease}
.step.in::before{width:100%}
.step .sn{font-size:3.2rem;font-weight:300;line-height:1;color:var(--teal-logo);margin-bottom:14px}
.step h3{font-size:1.2rem;font-weight:500;margin-bottom:8px}
.step p{font-size:.95rem;color:var(--gray-dk);font-weight:300}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:34px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:34px}
.chip{border:1px solid var(--teal2);background:transparent;color:var(--teal-dk);font:400 .84rem var(--font);padding:6px 16px;cursor:pointer;transition:all .2s}
.chip:hover{background:#fff}
.chip.on{background:var(--teal-dk);border-color:var(--teal-dk);color:#fff}
.ctl{position:absolute;top:8px;right:8px;display:none;gap:4px;z-index:3}
body.edit .ctl{display:flex}
.ctl button{background:#fff;border:1px solid var(--teal2);color:var(--teal-dk);font:500 .74rem var(--font);padding:4px 9px;cursor:pointer}
.ctl button:hover{background:var(--teal-dk);color:#fff}

.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 48px}
.svc{position:relative;padding:30px 0 34px;border-top:1px solid var(--line)}
.svc .n{font-size:.85rem;color:var(--teal-logo);font-weight:500;margin-bottom:10px}
.svc h3{font-size:1.2rem;font-weight:500;color:var(--text);margin-bottom:8px}
.svc p{font-size:.95rem;color:var(--gray-dk);font-weight:300}

#contato{background:var(--teal-lt)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:88px}
.ci{padding:16px 0;border-bottom:1px solid #cfe3e3}
.ci:first-child{border-top:1px solid #cfe3e3}
.ci .l{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-dk);font-weight:500}
.ci .v{font-size:1.05rem;color:var(--text)}
.ci a{text-decoration:none}
.ci a:hover{color:var(--teal-dk)}
.tools{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap}
.tool{display:flex;align-items:center;gap:14px;text-decoration:none}
.tool .ic{width:64px;height:64px;border:2px solid var(--teal2);border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;transition:background .2s}
.tool:hover .ic{background:var(--teal-lt)}
.tool svg{width:28px;height:28px;stroke:var(--teal-dk);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool b{display:block;font-weight:600;font-size:.98rem;color:var(--text);line-height:1.2}
.tool span{font-size:.82rem;color:var(--gray-dk)}
form label{display:block;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-dk);font-weight:500;margin-bottom:18px}
form input,form textarea,.modal input,.modal textarea{display:block;width:100%;margin-top:6px;border:1px solid #c5dcdc;background:#fff;color:var(--text);font:400 1rem var(--font);padding:11px 13px;outline:none;transition:border-color .2s;text-transform:none;letter-spacing:0}
form input:focus,form textarea:focus,.modal input:focus,.modal textarea:focus{border-color:var(--teal-dk)}
form textarea{min-height:120px;resize:vertical}
.form-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}

.foot{background:var(--gray-dk);color:#fff;padding:30px 0}
.foot-in{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.foot img{width:64px;height:64px;border-radius:50%;background:#fff}
.foot .t{font-size:.86rem;line-height:1.55;flex:1;min-width:240px}
.foot .t b{font-weight:500}
.foot a{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}
.foot a:hover{border-color:#fff}

.overlay{position:fixed;inset:0;background:rgba(40,44,46,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:#fff;width:min(620px,100%);max-height:90vh;overflow-y:auto;padding:34px;border-top:6px solid var(--teal2)}
.modal.wide{width:min(900px,100%);padding:0;border-top:6px solid var(--teal2)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.mh h3{font-size:1.35rem;font-weight:500}
.x{background:none;border:none;font-size:1.5rem;color:var(--gray-dk);cursor:pointer;line-height:1}
.modal label{display:block;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-dk);font-weight:500;margin-bottom:16px}
.modal .hint{font-size:.84rem;color:var(--gray-dk);margin-bottom:16px}
.imgf input[type=file]{border:none;padding:8px 0;font-size:.85rem}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.mact .grow{margin-right:auto}
.det img{width:100%;max-height:62vh;object-fit:contain;background:var(--teal-lt)}
.det .dph{aspect-ratio:16/9;background:var(--teal-lt);display:flex;align-items:center;justify-content:center}
.det .dph img{width:90px;opacity:.6}
.det .dt{padding:26px 34px 22px}
.det .dx{padding:0 34px 34px;display:grid;gap:10px}
.det .dx img{max-height:none;height:auto;object-fit:contain}
@media(max-width:640px){.det .dt{padding:22px 20px 16px}.det .dx{padding:0 20px 24px}}
.det .dt .cat{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-dk);font-weight:500}
.det .dt h3{font-size:1.7rem;font-weight:500;line-height:1.2}
.det .dt .ano{color:var(--gray-dk);font-size:.9rem;margin-bottom:12px}
.det .dt p{color:var(--gray-dk);font-weight:300;white-space:pre-line}
.det .close{position:absolute;right:14px;top:10px;z-index:2;background:#fff;border-radius:50%;width:34px;height:34px}
.modal.wide{position:relative}

.editbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:150;background:var(--teal-dk);color:#fff;display:none;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap;justify-content:center;max-width:94vw}
body.edit .editbar{display:flex}
.editbar span{font-size:.82rem;margin-right:6px}
.editbar button{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;font:500 .78rem var(--font);padding:6px 12px;cursor:pointer}
.editbar button:hover{background:#fff;color:var(--teal-dk)}
body.edit [data-field]{outline:1px dashed var(--teal2);outline-offset:3px;cursor:pointer}
body.edit [data-field]:hover{outline:1px solid var(--teal-dk)}
body.edit #foto{cursor:pointer;outline:1px dashed var(--teal2)}
.toast{position:fixed;right:24px;bottom:24px;background:#fff;border:1px solid var(--teal2);border-left:6px solid var(--teal2);color:var(--text);padding:12px 20px;font-size:.88rem;z-index:300;transform:translateY(120px);opacity:0;transition:all .3s;max-width:360px}
.toast.show{transform:none;opacity:1}
body.edit .toast{bottom:84px}

.rv{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}

@media(max-width:860px){
  .wrap{padding:0 24px 0 28px}
  section{padding:68px 0}
  .nav-links li:not(.keep){display:none}
  .hero{padding:80px 0 90px}
  .about,.contact{grid-template-columns:1fr;gap:48px}
  .foto-wrap{max-width:420px}
  .svc-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .bar-t,.bar-g{width:5px}
}

.burger{display:none;width:44px;height:44px;background:none;border:0;cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:6px;margin-right:-10px}
.burger span{display:block;width:24px;height:2px;background:var(--gray-dk);transition:transform .25s,opacity .2s}
.burger.open span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
@media(max-width:860px){
  .burger{display:flex}
  .nav-links{position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;gap:0;border-bottom:1px solid var(--line);box-shadow:0 14px 24px rgba(0,0,0,.08);max-height:0;overflow:hidden;visibility:hidden;transition:max-height .3s ease,visibility .3s}
  .nav-links.open{max-height:420px;visibility:visible}
  .nav-links li,.nav-links li:not(.keep){display:block}
  .nav-links li a{display:block;padding:16px 28px;font-size:1.02rem;border-top:1px solid var(--line)}
  .nav-links li:has(#editBtn){display:none}
}
@media(max-width:640px){
  .nav-in{height:60px}
  .nav-in img{height:32px}
  section{padding:56px 0}
  .hero{min-height:auto;padding:56px 0 64px}
  .hero p.lead{font-size:1.02rem;margin-bottom:30px}
  .hero .cta .btn{flex:1 1 100%;text-align:center;justify-content:center;padding:15px 20px}
  .slides{--sw:88vw;gap:14px}
  .scap{flex-direction:column;align-items:flex-start;gap:4px}
  .scap .nome{font-size:1.3rem}
  .arrows button{width:48px;height:48px}
  .slider-nav{margin-top:22px}
  .strip{padding:0 20px;gap:12px}
  .gi{flex-basis:70vw}
  .stats{gap:10px}
  .btn{min-height:46px}
  input,textarea,select{font-size:16px!important}
}

/* layout centralizado */
.eyebrow{justify-content:center}
section h2,.sec-head h2{text-align:center}
.sec-head{flex-direction:column;align-items:center;text-align:center}
.filters{justify-content:center}
.hero>.wrap{text-align:center;display:flex;flex-direction:column;align-items:center}
.hero h1.hero-logo{margin-left:auto;margin-right:auto}
.hero p.lead{margin-left:auto;margin-right:auto}
.hero .cta{justify-content:center}
.about{max-width:1000px;margin:0 auto;text-align:center}
.stats{text-align:center}
.step,.svc{text-align:center}
.svc-grid,.steps{justify-items:stretch}
.ci{text-align:center}
.tools{justify-content:center}
.contact{align-items:start}
.scap{justify-content:center;text-align:center}
.slider-nav{justify-content:center;gap:28px}
.hintdrag{justify-content:center}
.foot-in{flex-direction:column;justify-content:center;align-items:center;text-align:center}
.foot-in .t{text-align:center}
@media(max-width:640px){.hero-brand{width:165px;margin-bottom:22px}.scap{align-items:center}.stat-v{font-size:1.35rem;white-space:nowrap}.stat-l{font-size:.76rem}}

/* painel de edição */
.lbl{display:block;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-dk);font-weight:500;margin-bottom:8px}
.imgrows{display:grid;gap:8px;margin-bottom:10px;max-height:46vh;overflow:auto;padding-right:4px}
.irow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:6px}
.irow img{width:64px;height:48px;object-fit:cover;background:#e8eef0}
.irow input{margin:0!important;padding:8px 10px!important;font-size:.92rem!important}
.irow .ib{display:flex;gap:3px}
.irow .ib button{width:30px;height:30px;border:1px solid var(--teal2);background:transparent;color:var(--teal-dk);cursor:pointer;font-size:.85rem}
.irow .ib button:hover{background:var(--teal-dk);color:#fff}
.det .dx figure{margin:0}
.det .dx figcaption{font-size:.86rem;color:var(--gray-dk);padding:8px 2px 4px}
.det .dedit{display:none;margin:0 34px 20px}
body.edit .det .dedit{display:inline-block}
.pbar{height:8px;background:#e1ecec;margin:14px 0}
.pbar i{display:block;height:100%;width:0;background:var(--teal2);transition:width .25s}
.editbar button.pri{background:#fff;color:var(--teal-dk);font-weight:600}
.editbar .stat{font-weight:600}
@media(max-width:640px){.irow{grid-template-columns:52px 1fr}.irow .ib{grid-column:1/-1;justify-content:flex-end}.irow img{width:52px;height:40px}.det .dedit{margin:0 20px 16px}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
/* ===== versão escura ===== */
:root{--text:#e6e8e9;--gray-dk:#a7adaf;--line:#2a2e30;--teal-lt:#172a2b;--teal-dk:#6fd3cb;--teal-logo:#6cc2ae}
body{background:#fff}
#page{background:#0e1011;box-shadow:0 0 0 1px #e3e6e7}
nav{background:#0e1011}
.burger span{background:#c8cdcf}
@media(max-width:860px){.nav-links{background:#0e1011;box-shadow:0 14px 24px rgba(0,0,0,.5)}}
#sobre{background:#0e1011}
#projetos{background:#16191a}
#processo{background:#121516}
#contato{background:#121516}
.btn{background:transparent;color:var(--teal-dk);border-color:var(--teal-dk)}
.btn:hover{background:rgba(111,211,203,.12)}
.btn.fill{background:#1c8a84;border-color:#1c8a84;color:#fff}
.hero .eyebrow,.eyebrow{color:var(--teal-dk)}
em{color:var(--teal-dk)}
.foto,.gimg{background:#1a1f20}
.det img,.det .dph{background:#1a1f20}
.modal,.toast{background:#16191a;color:var(--text)}
.det .close{background:#2a2e30;color:#fff}
form input,form textarea,.modal input,.modal textarea,.modal select{background:#0e1011;border-color:#333a3c;color:var(--text)}
.ci,.ci:first-child{border-color:#2a2e30}
.tool .ic{background:#0e1011}
.tool:hover .ic{background:#172a2b}
.chip{color:#cfd5d6;border-color:#4a5154}
.chip.on{background:var(--teal2);border-color:var(--teal2);color:#0b1d1c}
.foot{background:#050606;border-top:1px solid #1f2325}
.stats{border-top-color:#2a2e30}
.stat-v{color:var(--teal-dk)}
.ctl button{background:#16191a}

.irow{border-color:#2f3537}.irow img{background:#1a1f20}.irow .ib button{color:var(--teal-dk);border-color:#3a6b69}.lbl{color:var(--teal-dk)}
.pbar{background:#2a2e30}.det .dx figcaption{color:#a7adaf}

<section id="sobre">
  <div class="wrap about">

    <div class="rv">
      <div class="eyebrow">Sobre</div>
      <h2 data-field="sobre-titulo"></h2>
      <p data-field="sobre-p1"></p>
      <p data-field="sobre-p2"></p>

        <div><div class="stat-v" data-field="s1v"></div><div class="stat-l" data-field="s1l"></div></div>

<section id="projetos">
  <div class="wrap">
    <div class="sec-head">
      <div><div class="eyebrow">Portfólio</div><h2 style="margin:0">Projetos</h2></div>
      <button class="btn sm fill" id="addProj" style="display:none" onclick="editProject()">+ Novo projeto</button>
    </div>
    <div class="filters" id="filters" data-dyn></div>
  </div>
  <div class="slides" id="slides" data-dyn></div>
  <div class="wrap slider-nav">
    <div class="cnt" id="cnt" data-dyn></div>
    <div class="arrows"><button aria-label="Projeto anterior" onclick="slideBy(-1)">←</button><button aria-label="Próximo projeto" onclick="slideBy(1)">→</button></div>
  </div>
</section>

<section id="galeria" style="padding-bottom:80px">
  <div class="wrap">
    <div class="sec-head">
      <div><div class="eyebrow">Galeria</div><h2 style="margin:0" data-field="galeria-titulo"></h2></div>
      <div class="hintdrag"><span>Arraste para explorar ↔</span>
        <button class="btn sm" id="galPlay" onclick="toggleGal()">Pausar</button>
        <button class="btn sm fill" id="addGal" style="display:none" onclick="$('#galFiles').click()">+ Adicionar fotos</button>
        <input type="file" id="galFiles" accept="image/*" multiple style="display:none" onchange="addGallery(this)">
      </div>
    </div>

</section>

<section id="processo">
  <div class="wrap">
    <div class="sec-head">
      <div><div class="eyebrow">Processo</div><h2 style="margin:0" data-field="processo-titulo"></h2></div>
      <button class="btn sm fill" id="addStep" style="display:none" onclick="editList('process')">+ Nova etapa</button>
    </div>
    <div class="steps" id="steps" data-dyn></div>
  </div>
</section>

<section id="servicos">
  <div class="wrap">
    <div class="sec-head">
      <div><div class="eyebrow">Atuação</div><h2 style="margin:0">Serviços</h2></div>
      <button class="btn sm fill" id="addSvc" style="display:none" onclick="editList('services')">+ Novo serviço</button>
    </div>
    <div class="svc-grid" id="svcGrid" data-dyn></div>
  </div>
</section>

<section id="contato">
  <div class="wrap contact">
    <div class="rv">
      <div class="eyebrow">Contato</div>
      <h2 data-field="contato-titulo"></h2>
      <div id="contactInfo" data-dyn></div>
      <div class="tools" id="tools" data-dyn></div>
    </div>
    <div class="rv">
      <form id="form" onsubmit="sendForm(event)">
        <label>Nome<input id="fn" type="text" required autocomplete="name"></label>
        <label>WhatsApp ou e-mail para resposta<input id="fc" type="text" required autocomplete="email" placeholder="(31) 9…… ou nome@email.com"></label>
        <label>Tipo de projeto<input id="ft" type="text" placeholder="Residência, loja, consultório, regularização…"></label>
        <label>Mensagem<textarea id="fm" placeholder="Conte em poucas linhas o que você precisa."></textarea></label>
        <div class="form-actions">
          <button class="btn fill" type="submit" id="fsend">Enviar mensagem</button>
          <button class="btn" type="button" onclick="sendWa()">Falar pelo WhatsApp</button>
        </div>
        <input type="text" id="fh" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">
        <p id="fstat" role="status" style="margin-top:12px;font-size:.9rem;color:var(--teal-dk)"></p>
      </form>
    </div>
  </div>
</section>

<footer>

</footer>

const seed=JSON.parse($('#seed').textContent);
/* imagens do conteúdo original ficam só no HTML; o armazenamento do navegador guarda apenas referências (~n) */
const SEEDIMG=[];(function w(o){if(o&&typeof o==='object'){for(const k in o){const v=o[k];if(typeof v==='string'&&v.length>2000&&v.startsWith('data:'))SEEDIMG.push(v);else w(v)}}})(seed);
const SEEDIDX=new Map();SEEDIMG.forEach((v,i)=>{if(!SEEDIDX.has(v))SEEDIDX.set(v,i)});
function slim(o){if(Array.isArray(o))return o.map(slim);if(o&&typeof o==='object'){const r={};for(const k in o)r[k]=slim(o[k]);return r}return (typeof o==='string'&&SEEDIDX.has(o))?'~'+SEEDIDX.get(o):o}
function fat(o){if(Array.isArray(o))return o.map(fat);if(o&&typeof o==='object'){const r={};for(const k in o)r[k]=fat(o[k]);return r}return (typeof o==='string'&&/^~\d+$/.test(o))?(SEEDIMG[+o.slice(1)]||''):o}
const normImgs=a=>(a||[]).map(x=>typeof x==='string'?{img:x,cap:''}:{img:x.img||'',cap:x.cap||''}).filter(x=>x.img);
function merge(s){
  s=s||{};const im=Object.assign({},seed.images);for(const k in (s.images||{}))if(s.images[k])im[k]=s.images[k];
  return {heroTone:s.heroTone||seed.heroTone,fields:Object.assign({},seed.fields,s.fields),images:im,
    projects:(s.projects||seed.projects).map(p=>Object.assign({},p,{imgs:normImgs(p.imgs)})),
    services:s.services||seed.services,gallery:(s.gallery||seed.gallery).map(g=>({img:g.img,cap:g.cap||''})),
    process:s.process||seed.process,contact:Object.assign({},seed.contact,s.contact)};
}

const GAP=24;
function slideList(){return state.projects.filter(p=>filtro==='Todos'||p.cat===filtro)}
function renderProjects(){
  const list=slideList(),box=$('#slides');
  box.innerHTML=list.length?list.map(p=>`

     <div class="simg">${p.img?`<div class="bg" style="background-image:url('${esc(p.img)}')"></div><img class="real" draggable="false" loading="lazy" src="${esc(p.img)}" alt="${esc(p.nome)}">`:`<img class="ph" draggable="false" src="${LOGOC}" alt="">`}</div>

   </article>`).join(''):'<div class="empty">Nenhum projeto nesta categoria.</div>';

function slideIndex(){
  const s=$('#slides'),sl=s.querySelector('.slide');if(!sl)return 0;
  const n=s.querySelectorAll('.slide').length,step=sl.offsetWidth+GAP;
  if(s.scrollLeft>=s.scrollWidth-s.clientWidth-3)return n-1;
  return Math.min(n-1,Math.max(0,Math.round(s.scrollLeft/step)));
}
function updateCount(){
  const n=$('#slides').querySelectorAll('.slide').length;
  $('#cnt').textContent=n?String(slideIndex()+1).padStart(2,'0')+' / '+String(n).padStart(2,'0'):'';
}
function slideBy(d){
  const s=$('#slides'),sl=s.querySelector('.slide');if(!sl)return;
  const n=s.querySelectorAll('.slide').length,i=Math.min(n-1,Math.max(0,slideIndex()+d));
  s.scrollTo({left:i*(sl.offsetWidth+GAP),behavior:'smooth'});
}
function dragScroll(el){
  let down=false,sx=0,sl=0,moved=false;
  el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;down=true;moved=false;sx=e.clientX;sl=el.scrollLeft});
  window.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>4){moved=true;el.classList.add('drag')}if(moved)el.scrollLeft=sl-dx});
  window.addEventListener('pointerup',()=>{if(!down)return;down=false;el.classList.remove('drag');el._moved=moved;setTimeout(()=>{el._moved=false},0)});
  el.addEventListener('click',e=>{if(el._moved){e.stopPropagation();e.preventDefault()}},true);
}

const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let galPos=0,galPaused=reduce,galHover=false,galVis=true;
function renderGallery(){
  const g=state.gallery,real=g.length>0,items=real?g:Array.from({length:6},()=>({img:'',cap:''}));
  const one=(x,i,dup)=>`<div class="gi"${dup?' aria-hidden="true"':''}><div class="gimg">${x.img?`<img class="real" draggable="false" loading="lazy" src="${esc(x.img)}" alt="${esc(x.cap)}">`:`<img class="ph" draggable="false" src="${LOGOC}" alt="">`}</div><div class="gcap">${esc(x.cap)}</div>${(!dup&&real)?`<div class="ctl"><button onclick="moveGal(${i},-1)">←</button><button onclick="moveGal(${i},1)">→</button><button onclick="editGallery(${i})">Editar</button></div>`:''}</div>`;
  $('#strip').innerHTML=items.map((x,i)=>one(x,i,false)).join('')+items.map((x,i)=>one(x,i,true)).join('');
  $('#galPlay').textContent=galPaused?'Reproduzir':'Pausar';
}
function toggleGal(){galPaused=!galPaused;$('#galPlay').textContent=galPaused?'Reproduzir':'Pausar'}
function galLoop(){
  const s=$('#strip');
  if(s&&!galPaused&&!galHover&&galVis&&!edit&&!s.classList.contains('drag')){
    galPos+=.55;const half=s.scrollWidth/2;if(half>0&&galPos>=half)galPos-=half;s.scrollLeft=galPos;
  }
  requestAnimationFrame(galLoop);
}
async function addGallery(inp){
  const items=[];

  openForm({title:'Adicionar à galeria',hint:'Escreva a legenda de cada foto (opcional). Use ↑ ↓ para ordenar.',fields:[{k:'list',label:'Fotos novas',type:'imgs',max:1400}],values:{list:items},
    onSave:o=>{state.gallery.push(...o.list);save();renderGallery();toast(o.list.length+' foto(s) adicionada(s). Clique em "Publicar no site".')}});
}

let io;
function observe(){
  if(!('IntersectionObserver' in window)){document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));return}
  io=io||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
  document.querySelectorAll('.rv:not(.in)').forEach(e=>io.observe(e));
}

/* ---------- formulário genérico de edição ---------- */
function readImage(file,max=1600,q=.82){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q))};
      im.onerror=rej;im.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}
function openForm({title,hint,fields,values={},onSave,onDelete}){
  const store={};
  $('#mtitle').textContent=title;
  $('#mbody').innerHTML=(hint?`<p class="hint">${esc(hint)}</p>`:'')+fields.map(f=>{
    const v=values[f.k]==null?'':String(values[f.k]),id='f_'+f.k;
    if(f.type==='area')return `<label>${esc(f.label)}<textarea id="${id}" rows="${f.rows||4}">${esc(v)}</textarea></label>`;
    if(f.type==='imgs'){store[f.k]=normImgs(values[f.k]);return `<div class="lbl">${esc(f.label)}</div><div class="imgrows" id="${id}_rows"></div><div class="imgf"><input type="file" accept="image/*" multiple id="${id}_f"></div><div style="height:12px"></div>`}
    if(f.type==='password')return `<label>${esc(f.label)}<input id="${id}" type="password" autocomplete="off" value="${esc(v)}"></label>`;
    if(f.type==='img'){if(v.startsWith('data:'))store[f.k]=v;
      return `<label>${esc(f.label)}<div class="imgf"><input id="${id}" type="text" placeholder="Cole um link ou envie um arquivo abaixo" value="${v.startsWith('data:')?'(imagem enviada)':esc(v)}"><input type="file" accept="image/*" id="${id}_f"></div></label>`}
    return `<label>${esc(f.label)}<input id="${id}" type="text" value="${esc(v)}"></label>`;
  }).join('')+`<div class="mact">${onDelete?'<button class="btn danger grow" id="mdel">Excluir</button>':''}<button class="btn" onclick="closeM(\'modal\')">Cancelar</button><button class="btn fill" id="msave">Salvar</button></div>`;
  fields.filter(f=>f.type==='img').forEach(f=>{
    $('#f_'+f.k+'_f').onchange=async e=>{const file=e.target.files[0];if(!file)return;
      try{store[f.k]=await readImage(file,f.max||1600);$('#f_'+f.k).value='(imagem enviada)'}catch(_){toast('Não consegui ler essa imagem')}};
    $('#f_'+f.k).oninput=()=>{delete store[f.k]};
  });
  fields.filter(f=>f.type==='imgs').forEach(f=>{
    const draw=()=>{const box=$('#f_'+f.k+'_rows'),a=store[f.k];
      box.innerHTML=a.map((x,i)=>`<div class="irow"><img src="${esc(x.img)}" alt=""><input type="text" data-i="${i}" placeholder="Legenda (opcional)" value="${esc(x.cap)}"><div class="ib"><button type="button" data-a="u" data-i="${i}" title="Subir">↑</button><button type="button" data-a="d" data-i="${i}" title="Descer">↓</button><button type="button" data-a="x" data-i="${i}" title="Remover">✕</button></div></div>`).join('')||'<p class="hint">Nenhuma foto. Use o campo abaixo para adicionar.</p>';
      box.querySelectorAll('input[data-i]').forEach(inp=>inp.oninput=()=>{a[+inp.dataset.i].cap=inp.value});
      box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(b.dataset.a==='x')a.splice(i,1);else{const j=i+(b.dataset.a==='u'?-1:1);if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}draw()})};
    draw();
    $('#f_'+f.k+'_f').onchange=async e=>{for(const file of e.target.files){try{store[f.k].push({img:await readImage(file,f.max||1600,.8),cap:''})}catch(_){toast('Não consegui ler uma das imagens')}}e.target.value='';draw()};
  });
  $('#msave').onclick=()=>{
    const out={};fields.forEach(f=>{out[f.k]=f.type==='imgs'?store[f.k].filter(x=>x.img):(f.type==='img'&&store[f.k]!==undefined)?store[f.k]:$('#f_'+f.k).value.trim()});
    if(onSave(out)!==false)closeM('modal');
  };
  if(onDelete)$('#mdel').onclick=()=>{if(confirm('Excluir definitivamente?')){onDelete();closeM('modal')}};
  $('#modal').classList.add('open');
}

function moveProject(id,d){
  const a=state.projects,i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];save();renderProjects();
}
function editList(key,i){
  const arr=state[key],s=i==null?null:arr[i],lab=key==='process'?'etapa':'serviço';
  const redraw=()=>{arr.forEach((x,k)=>x.n=String(k+1).padStart(2,'0'));save();key==='process'?renderProcess():renderServices()};
  openForm({title:(s?'Editar ':'Nova ')+lab,fields:[{k:'t',label:'Título'},{k:'d',label:'Descrição',type:'area',rows:4}],values:s||{},
    onSave:o=>{if(!o.t){toast('Informe o título');return false}
      if(s){s.t=o.t;s.d=o.d}else arr.push({n:'',t:o.t,d:o.d});redraw()},
    onDelete:s?()=>{arr.splice(i,1);redraw()}:null});
}
function editContact(){
  openForm({title:'Contato e links',hint:'Links de Briefing e Viabilidade só aparecem no site quando preenchidos.',
    fields:[{k:'email',label:'E-mail'},{k:'tel',label:'Telefone / WhatsApp'},{k:'end',label:'Endereço'},{k:'hora',label:'Atendimento (opcional)'},

function toggleEdit(){

  ['addProj','addSvc','addGal','addStep','heroBtn','toneBtn'].forEach(id=>$('#'+id).style.display=edit?'inline-block':'none');
  renderContact();updateStat();

/* ---------- exportar / importar ---------- */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportSite(){
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#seed').textContent=JSON.stringify(state).replace(/</g,'\\u003c');
  c.querySelector('body').className='';
  c.querySelectorAll('[data-dyn],[data-field]').forEach(e=>e.innerHTML='');
  c.querySelectorAll('.overlay').forEach(o=>o.classList.remove('open'));
  c.querySelectorAll('img[data-logo],img[data-logoc]').forEach(i=>i.removeAttribute('src'));
  c.querySelector('#favicon').setAttribute('href','data:,');
  c.querySelector('#editBtn').removeAttribute('style');c.querySelector('#editBtn').style.display='none';
  ['addProj','addSvc','addGal','addStep','heroBtn','toneBtn'].forEach(id=>c.querySelector('#'+id).style.display='none');c.querySelector('#inicio').classList.remove('has-img','light');
  download('index.html','<!DOCTYPE html>\n'+c.outerHTML,'text/html');
  toast('index.html gerado. Publique este arquivo no GitHub Pages.');
}
function exportJson(){download('portfolio-dados.json',JSON.stringify(state,null,1),'application/json');toast('Dados exportados (backup).')}
function importJson(inp){
  const f=inp.files[0];if(!f)return;
  f.text().then(t=>{state=merge(JSON.parse(t));save();renderAll();toast('Dados importados. Clique em "Publicar no site" para enviar.')}).catch(()=>toast('Arquivo inválido.'));
  inp.value='';

function resetAll(){if(confirm('Descartar as alterações ainda não publicadas e voltar ao que está no ar?')){try{localStorage.removeItem(KEY);localStorage.removeItem('cp_dirty')}catch(e){}location.reload()}}

/* ---------- publicação direta no GitHub (um único commit) ---------- */
const ghCfg=()=>{const d={owner:'claudiopupo',repo:'site',branch:'main'};try{return Object.assign(d,JSON.parse(localStorage.getItem('cp_gh_cfg')||'{}'))}catch(e){return d}};
const ghTok=()=>{try{return localStorage.getItem('cp_gh_token')||''}catch(e){return ''}};
async function gh(path,method,body){
  const c=ghCfg(),r=await fetch('https://api.github.com/repos/'+c.owner+'/'+c.repo+path,{method:method||'GET',headers:{Authorization:'Bearer '+ghTok(),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const t=await r.json().catch(()=>({}));const e=new Error(t.message||('HTTP '+r.status));e.status=r.status;throw e}
  return r.json();
}
function connectGh(thenPublish){
  const c=ghCfg();
  openForm({title:'Conectar ao GitHub',
    hint:'Uma vez só: no GitHub, abra Settings > Developer settings > Personal access tokens > Fine-grained tokens > Generate new token. Em Repository access escolha "Only select repositories" > '+c.owner+'/'+c.repo+'. Em Permissions > Repository permissions deixe "Contents" como Read and write. Copie o token e cole abaixo. Ele fica salvo só neste navegador.',
    fields:[{k:'tok',label:'Token de acesso',type:'password'},{k:'owner',label:'Usuário do GitHub'},{k:'repo',label:'Repositório'},{k:'branch',label:'Branch'}],
    values:{tok:'',owner:c.owner,repo:c.repo,branch:c.branch},
    onSave:o=>{
      try{localStorage.setItem('cp_gh_cfg',JSON.stringify({owner:o.owner||c.owner,repo:o.repo||c.repo,branch:o.branch||c.branch}));if(o.tok)localStorage.setItem('cp_gh_token',o.tok)}catch(e){}
      if(!ghTok()){toast('Cole o token para conectar.');return}
      gh('').then(r=>{toast('Conectado a '+r.full_name+(r.permissions&&!r.permissions.push?' (sem permissão de escrita!)':'.'));updateStat();if(thenPublish)publish()}).catch(e=>toast('Não conectou: '+(e.status===401?'token inválido ou expirado.':e.status===404?'repositório não encontrado ou token sem acesso a ele.':e.message)));
    },
    onDelete:ghTok()?()=>{try{localStorage.removeItem('cp_gh_token')}catch(e){}updateStat();toast('Token removido deste navegador.')}:null});
}
const utf8b64=t=>{const b=new TextEncoder().encode(t);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
function pubUI(title,pct,msg){$('#ptitle').textContent=title;$('#pbody').innerHTML=`<div class="pbar"><i style="width:${pct}%"></i></div><p class="hint">${esc(msg)}</p>`;$('#pub').classList.add('open')}
let publishing=false;
async function publish(){
  if(publishing)return;
  if(!ghTok()){connectGh(true);return}
  publishing=true;
  try{
    const next=JSON.parse(JSON.stringify(state)),files=[],map=new Map();let n=0;
    const up=v=>{if(typeof v!=='string'||!v.startsWith('data:'))return v;if(!map.has(v)){const p='fotos/'+Date.now().toString(36)+'-'+(n++)+'.jpg';map.set(v,p);files.push({path:p,b64:v.split(',')[1]})}return map.get(v)};
    for(const k in next.images)next.images[k]=up(next.images[k]);
    next.projects.forEach(p=>{p.img=up(p.img);p.imgs.forEach(x=>x.img=up(x.img))});
    next.gallery.forEach(g=>g.img=up(g.img));
    const dados={v:2,atualizado:new Date().toISOString(),heroTone:next.heroTone,fields:next.fields,images:next.images,projects:next.projects,services:next.services,gallery:next.gallery,process:next.process,contact:next.contact};
    files.push({path:'dados.json',b64:utf8b64(JSON.stringify(dados,null,1))});
    const c=ghCfg(),total=files.length+4;let done=0;const step=m=>pubUI('Publicando…',Math.round(++done/total*100),m);
    pubUI('Publicando…',2,'Conectando ao GitHub…');
    const ref=await gh('/git/ref/heads/'+c.branch);step('Preparando…');
    const cm=await gh('/git/commits/'+ref.object.sha);
    const tree=[];
    for(const f of files){const b=await gh('/git/blobs','POST',{content:f.b64,encoding:'base64'});tree.push({path:f.path,mode:'100644',type:'blob',sha:b.sha});step('Enviando '+f.path+' ('+tree.length+'/'+files.length+')')}
    const t=await gh('/git/trees','POST',{base_tree:cm.tree.sha,tree});step('Montando versão…');
    const nc=await gh('/git/commits','POST',{message:'Atualização do portfólio pelo painel',tree:t.sha,parents:[ref.object.sha]});
    await gh('/git/refs/heads/'+c.branch,'PATCH',{sha:nc.sha});
    state=merge(dados);try{localStorage.removeItem(KEY);localStorage.removeItem('cp_dirty')}catch(e){}
    renderAll();updateStat();
    pubUI('Publicado',100,'Alterações enviadas. O site público atualiza em 1 a 3 minutos (atualize com Ctrl+F5).');
    setTimeout(()=>closeM('pub'),3500);
  }catch(e){
    const m=e.status===401?'Token inválido ou expirado. Clique em GitHub para reconectar.':e.status===403||e.status===404?'Sem permissão de escrita no repositório. Confira o token (Contents: Read and write) e o nome do repositório.':(e.message||'erro desconhecido');
    pubUI('Não foi possível publicar',0,m+' Suas alterações continuam salvas neste navegador.');
  }
  publishing=false;
}

/* ---------- contato ---------- */
function sendWa(){
  const t=`Olá, Cláudio! Sou ${$('#fn').value||''}.`+($('#ft').value?`\nProjeto: ${$('#ft').value}`:'')+($('#fm').value?`\n${$('#fm').value}`:'');
  window.open(`https://wa.me/${wa()}?text=${encodeURIComponent(t)}`,'_blank','noopener');
}
/* envio direto por e-mail (serviço FormSubmit): a mensagem chega no e-mail de contato, sem o visitante abrir app de e-mail */
async function sendForm(e){
  e.preventDefault();
  if($('#fh').value)return;
  const st=$('#fstat'),btn=$('#fsend'),to=(state.contact.email||'').trim();
  if(!to){sendWa();return}
  const c=$('#fc').value.trim();
  btn.disabled=true;st.textContent='Enviando…';
  const body={_subject:'Contato pelo site'+($('#ft').value?' — '+$('#ft').value:''),_template:'table',_captcha:'false',
    Nome:$('#fn').value.trim(),Contato:c,'Tipo de projeto':$('#ft').value.trim(),Mensagem:$('#fm').value.trim()};
  if(/@/.test(c))body._replyto=c;
  try{
    const r=await fetch('https://formsubmit.co/ajax/'+encodeURIComponent(to),{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||j.success==='false'||j.success===false)throw new Error(j.message||'erro');
    st.textContent='Mensagem enviada. Retornarei em breve.';$('#form').reset();
  }catch(_){
    st.innerHTML='Não consegui enviar agora. <a href="#" onclick="sendWa();return false">Fale pelo WhatsApp</a>.';
  }
  btn.disabled=false;
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3600)}

async function loadRemote(){
  let d=null;
  try{
    if(admin&&ghTok()){const c=ghCfg(),r=await fetch('https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/dados.json?ref='+c.branch,{headers:{Authorization:'Bearer '+ghTok(),Accept:'application/vnd.github.raw+json'}});if(r.ok)d=await r.json()}
    if(!d){const r=await fetch('dados.json',{cache:'no-cache'});if(r.ok)d=await r.json()}
  }catch(e){}
  return d;
}
{const p=loadRemote();
 p.then(d=>{if(d&&!(admin&&isDirty())){state=merge(d);renderAll()}});
 Promise.race([p,new Promise(r=>setTimeout(r,1800))]).then(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('ld')));}
renderAll();updateStat();
dragScroll($('#slides'));dragScroll($('#strip'));
let rafC=0;$('#slides').addEventListener('scroll',()=>{cancelAnimationFrame(rafC);rafC=requestAnimationFrame(updateCount)},{passive:true});
const strip=$('#strip');
strip.addEventListener('mouseenter',()=>galHover=true);strip.addEventListener('mouseleave',()=>galHover=false);
strip.addEventListener('touchstart',()=>galHover=true,{passive:true});strip.addEventListener('touchend',()=>setTimeout(()=>galHover=false,1500));
strip.addEventListener('scroll',()=>{const half=strip.scrollWidth/2;if(half>0&&strip.scrollLeft>=half)strip.scrollLeft-=half;if(Math.abs(strip.scrollLeft-galPos)>2)galPos=strip.scrollLeft},{passive:true});
if('IntersectionObserver' in window){
  new IntersectionObserver(es=>es.forEach(e=>galVis=e.isIntersecting)).observe(strip);
  new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){countUp();o.disconnect()}}),{threshold:.6}).observe($('.stats'));
}
galLoop();
